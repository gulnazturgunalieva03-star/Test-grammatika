<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фразеологизмдер Тести</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* Баштапкы меню стили */
        #start-screen {
            text-align: center;
        }

        #start-screen p {
            margin-bottom: 15px;
            font-weight: 600;
            color: #64748b;
        }

        .count-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .count-btn {
            background-color: #f1f5f9;
            border: 2px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .count-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #64748b;
            font-size: 14px;
        }

        .question {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }

        .btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
            animation: pulse 0.4s ease;
        }

        .btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
            animation: shake 0.4s ease;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Баштапкы тандоо экраны -->
    <div id="start-screen">
        <h1>Фразеологизмдер Тести</h1>
        <p>Иштегиңиз келген суроолордун санын тандаңыз:</p>
        <div class="count-options">
            <button class="count-btn" onclick="startQuiz(10)">10 суроо</button>
            <button class="count-btn" onclick="startQuiz(15)">15 суроо</button>
            <button class="count-btn" onclick="startQuiz(20)">20 суроо</button>
            <button class="count-btn" onclick="startQuiz(30)">30 суроо</button>
            <button class="count-btn" onclick="startQuiz(50)">50 суроо</button>
            <button class="count-btn" onclick="startQuiz(allQuestions.length)">Бардыгы (Толук)</button>
        </div>
    </div>

    <!-- Тест экраны -->
    <div id="quiz-screen" style="display: none;">
        <h1>Фразеологизмдер Тести</h1>
        <div class="quiz-header">
            <span id="question-count">Суроо: 1/10</span>
            <span id="score-display">Упай: 0</span>
        </div>
        <div class="question" id="question-text">Суроо жүктөлүүдө...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Кийинки суроо</button>
    </div>

    <!-- Жыйынтык экраны -->
    <div class="result-screen" id="result-screen">
        <h2>Тест аяктады! 🎉</h2>
        <p id="final-score" style="font-size: 18px; margin-bottom: 20px;"></p>
        <button class="restart-btn" onclick="goToStart()">Башына кайтуу</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else {
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.type = 'sawtooth';
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz(count) {
        // Бардык суроолордун ичинен туура жооптор үчүн башка варианттарды даярдайбыз
        let formattedQuestions = allQuestions.map(item => {
            let otherOptions = allQuestions.filter(o => o.a !== item.a).map(o => o.a);
            let shuffledOthers = shuffle(otherOptions).slice(0, 3);
            return {
                q: item.q,
                a: item.a,
                others: shuffledOthers
            };
        });

        questions = shuffle(formattedQuestions).slice(0, count);
        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        document.getElementById('next-btn').style.display = 'none';
        
        let qData = questions[currentIndex];
        document.getElementById('question-count').innerText = `Суроо: ${currentIndex + 1}/${questions.length}`;
        document.getElementById('score-display').innerText = `Упай: ${score}`;
        document.getElementById('question-text').innerText = qData.q;

        let options = shuffle([qData.a, ...qData.others]);
        let container = document.getElementById('options-container');
        container.innerHTML = '';

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt, qData.a);
            container.appendChild(btn);
        });
    }

    function selectOption(button, selected, correct) {
        if (answered) return;
        answered = true;

        let buttons = document.querySelectorAll('.options .btn');
        buttons.forEach(b => {
            b.disabled = true;
            if (b.innerText === correct) {
                b.classList.add('correct');
            }
        });

        if (selected === correct) {
            score++;
            button.classList.add('correct');
            playSound('correct');
        } else {
            button.classList.add('incorrect');
            playSound('incorrect');
        }

        document.getElementById('score-display').innerText = `Упай: ${score}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `Сиз ${questions.length} суроодон ${score} туура жооп таптыңыз!`;
    }

    function goToStart() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }
