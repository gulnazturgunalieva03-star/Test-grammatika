<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фразеологизмдер Тести</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #64748b;
            font-size: 14px;
        }

        .question {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }

        .btn.correct {
            background-color: var(--success) !important;
            color: white;
            border-color: var(--success);
            animation: pulse 0.4s ease;
        }

        .btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            border-color: var(--error);
            animation: shake 0.4s ease;
        }

        .next-btn {
            margin-top: 20px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <h1>Фразеологизмдер Тести</h1>
        <div class="quiz-header">
            <span id="question-count">Суроо: 1/10</span>
            <span id="score-display">Упай: 0</span>
        </div>
        <div class="question" id="question-text">Суроо жүктөлүүдө...</div>
        <div class="options" id="options-container"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Кийинки суроо</button>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>Тест аяктады! 🎉</h2>
        <p id="final-score" style="font-size: 18px; margin-bottom: 20px;"></p>
        <button class="restart-btn" onclick="restartQuiz()">Кайра баштоо</button>
    </div>
</div>

<script>
    // Үн чыгаруу үчүн Web Audio API колдонобуз (файл жүктөбөй эле үн чыгарат)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else {
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.type = 'sawtooth';
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    const allQuestions = [
        { q: "Ичтеринен кан өттү", a: "Өтө кейүү, ичи ачышуу", others: ["Кыйынчылыкка кабылуу", "Өтө кубануу, сүйүнүү", "Уйку бетин көрбөө"] },
        { q: "Кара жаак", a: "Көп какшанган,тили заар", others: ["Адал эмгек", "Өз кызыкчылыгын көздөө", "Жылдызы ысык"] },
        { q: "Маңдайы жарылуу", a: "Өтө кубануу, сүйүнүү", others: ["Өтө кейүү", "Катуу коркуу", "Ачка калуу"] },
        { q: "Чечекейи чеч болуу", a: "Жадырап -жайноо", others: ["Капалануу", "Тили буудай кууруйт", "Кедейленүү"] },
        { q: "Ортого чычкан жорголобой", a: "Жакындабоо, араздашып калуу ,мамиленин үзүлушү", others: ["Ынтымактуу", "Достошпоо", "Тынчтык заман"] },
        { q: "Моюн толгоо", a: "Тил албоо ,айтканга көнбөгөн,бир нерсени жасоодон баш тарткан", others: ["Макул болуу", "Эмгектенүү", "Сыйлоо"] },
        { q: "Жинин каккан", a: "Жазалоо, урушчаак, тез жини келген", others: ["Мээримдүү", "Токтоо", "Акылман"] },
        { q: "Мурду менен бир тийүү", a: "Орой мамиле жасоо, корс", others: ["Жумшак мамиле", "Жардам берүү", "Сыйлоо"] },
        { q: "Кирпик какпай", a: "Уйку бетин көрбөө, уктабоо", others: ["Тاتтуу уктоо", "Эс алуу", "Тынч жатуу"] },
        { q: "Маңдай тер ,таман акы", a: "Адал эмгек ,өз күчү менен тапкан таман акы", others: ["Бекерчилик", "Уурулук", "Жалкоолук"] }
    ];

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
        questions = shuffle([...allQuestions]).slice(0, 10);
        currentIndex = 0;
        score = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        document.getElementById('next-btn').style.display = 'none';
        
        let qData = questions[currentIndex];
        document.getElementById('question-count').innerText = `Суроо: ${currentIndex + 1}/${questions.length}`;
        document.getElementById('score-display').innerText = `Упай: ${score}`;
        document.getElementById('question-text').innerText = qData.q;

        let options = shuffle([qData.a, ...qData.others]);
        let container = document.getElementById('options-container');
        container.innerHTML = '';

        options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt, qData.a);
            container.appendChild(btn);
        });
    }

    function selectOption(button, selected, correct) {
        if (answered) return;
        answered = true;

        let buttons = document.querySelectorAll('.options .btn');
        buttons.forEach(b => {
            b.disabled = true;
            if (b.innerText === correct) {
                b.classList.add('correct');
            }
        });

        if (selected === correct) {
            score++;
            button.classList.add('correct');
            playSound('correct');
        } else {
            button.classList.add('incorrect');
            playSound('incorrect');
        }

        document.getElementById('score-display').innerText = `Упай: ${score}`;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `Сиз 10 суроодон ${score} туура жооп таптыңыз!`;
    }

    function restartQuiz() {
        startQuiz();
    }

    startQuiz();
</script>

</body>
</html>
