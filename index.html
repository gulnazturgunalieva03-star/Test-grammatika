<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фразеологизмдер Тести</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .option-btn {
            background-color: #f1f5f9;
            color: var(--text);
            border: 1px solid var(--border);
            text-align: left;
            width: 100%;
            margin-bottom: 8px;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
        }

        .option-btn.correct {
            background-color: var(--success);
            color: white;
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background-color: var(--error);
            color: white;
            border-color: var(--error);
        }

        .progress {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .result-box {
            text-align: center;
        }

        .score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>

<div class="container">

        <div class="btn-group">

            <button onclick="startQuiz(20)">20 суроо</button>
            <button onclick="startQuiz(50)">50 суроо</button>
            <button onclick="startQuiz('all')">Бардык суроолор</button>

    </div>

    <!-- Суроолор экраны -->
    <div id="quiz-screen" class="screen">

        <div class="question-text" id="question-container">Суроо текст</div>

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(count) {
        let shuffledAll = shuffle([...allData]);
        if (count === 'all' || count >= shuffledAll.length) {
            currentQuestions = shuffledAll;
        } else {
            currentQuestions = shuffledAll.slice(0, count);
        }
        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResult();
            return;
        }

        const qData = currentQuestions[currentIndex];
        document.getElementById('progress-indicator').innerText = `Суроо ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-container').innerText = `"${qData.q}" фразеологизминин маанисин табыңыз:`;

        // Башка жооптордон туш келди 3 адаштыруучу вариант тандап алабыз
        let wrongOptions = allData
            .filter(item => item.a !== qData.a)
            .map(item => item.a);
        wrongOptions = shuffle(wrongOptions).slice(0, 3);

        let options = [...wrongOptions, qData.a];
        options = shuffle(options);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, qData.a);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(button, selected, correct) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('incorrect');
            buttons.forEach(b => {
                if (b.innerText === correct) {
                    b.classList.add('correct');
                }
            });
        }

        setTimeout(() => {
            currentIndex++;
            showQuestion();
        }, 1200);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('score-display').innerText = `${score} / ${currentQuestions.length}`;
    }
</script>

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(count) {
        let shuffledAll = shuffle([...allData]);
        if (count === 'all' || count >= shuffledAll.length) {
            currentQuestions = shuffledAll;
        } else {
            currentQuestions = shuffledAll.slice(0, count);
        }
        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            showResult();
            return;
        }

        const qData = currentQuestions[currentIndex];
        document.getElementById('progress-indicator').innerText = `Суроо ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('question-container').innerText = `"${qData.q}" фразеологизминин маанисин табыңыз:`;

        // Башка жооптордон туш келди 3 адаштыруучу вариант тандап алабыз
        let wrongOptions = allData
            .filter(item => item.a !== qData.a)
            .map(item => item.a);
        wrongOptions = shuffle(wrongOptions).slice(0, 3);

        let options = [...wrongOptions, qData.a];
        options = shuffle(options);

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => checkAnswer(btn, option, qData.a);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(button, selected, correct) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('incorrect');
            buttons.forEach(b => {
                if (b.innerText === correct) {
                    b.classList.add('correct');
                }
            });
        }

        setTimeout(() => {
            currentIndex++;
            showQuestion();
        }, 1200);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        document.getElementById('score-display').innerText = `${score} / ${currentQuestions.length}`;
    }
